<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personal Portfolio - Contact</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <nav>
      <div class="nav-container">
        <a href="./index.html" class="nav-link">Home</a>
        <a href="#about" class="nav-link">About</a>
        <a href="#projects" class="nav-link">Projects</a>
        <a href="./contact.html" class="nav-link nav-link--active">Contact</a>
      </div>
    </nav>
    <main>
      <div class="contact">
        <div class="contact__inner">
          <section class="contact__card">
            <h1 class="contact__title">Contact Me</h1>
            <p class="contact__subtitle">
              If you have a role, project, or collaboration in mind, send me a
              message and I will get back to you soon.
            </p>

            <form
              action="https://formspree.io/f/xbdekgda"
              method="POST"
              class="contact__form"
            >
              <div class="contact__field">
                <label for="name" class="contact__label">Name</label>
                <input
                  id="name"
                  name="name"
                  type="text"
                  required
                  class="contact__input"
                  placeholder="Your name"
                />
              </div>

              <div class="contact__field">
                <label for="email" class="contact__label">Email</label>
                <input
                  id="email"
                  name="email"
                  type="email"
                  required
                  class="contact__input"
                  placeholder="you@example.com"
                />
              </div>

              <div class="contact__field">
                <label for="subject" class="contact__label">Subject</label>
                <input
                  id="subject"
                  name="subject"
                  type="text"
                  class="contact__input"
                  placeholder="What is this about?"
                />
              </div>

              <div class="contact__field">
                <label for="message" class="contact__label">Message</label>
                <textarea
                  id="message"
                  name="message"
                  rows="6"
                  required
                  class="contact__textarea"
                  placeholder="Tell me about your idea, role, or project..."
                ></textarea>
              </div>

              <button type="submit" class="contact__submit">
                Send Message
              </button>
            </form>
          </section>

          <div class="contact__social">
            <a
              href="https://github.com/khksamuel"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="GitHub profile"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"
                ></path>
                <path d="M9 18c-4.51 2-5-2-7-2"></path>
              </svg>
            </a>
            <a
              href="https://www.linkedin.com/in/ka-hei-samuel-kwok-21b4a117a"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="LinkedIn profile"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"
                ></path>
                <rect width="4" height="12" x="2" y="9"></rect>
                <circle cx="4" cy="4" r="2"></circle>
              </svg>
            </a>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
